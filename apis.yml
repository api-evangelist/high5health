name: High5health
description: 'High5health (HighFive Healthcare) is a dental support organization that partners with
  endodontists and oral surgeons to run the business side of their specialty practices so the doctors
  can focus on patient care. Its managed services span human resources, accounting and legal, payroll,
  payor negotiations and credentialing, marketing, recruiting, revenue cycle management, IT and
  cybersecurity, procurement, insurance and risk management, and tax preparation. The company is a
  Norwest Venture Partners portfolio company. It operates as a healthcare business-services provider
  and does not publish a public developer platform, API, or SDK.'
